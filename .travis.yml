language: node_js
dist: focal
node_js:
- '0.10'
jobs:
  include:
    # Upstream `npm test` (grunt default: jsonlint/build/jshint/jscs/uglify/
    # dist/compare_size) under node 0.10, then the real QUnit unit suite
    # (upstream ran it in browsers via TestSwarm) in headless Chrome, served
    # by PHP for the test/data/*.php ajax fixtures.
    # Uses the google-chrome-stable the focal image ships (142) rather than
    # `addons: chrome: stable`: Chrome 156 sends a CSP report in the support
    # module's "Check CSP" test that 142 and 155 do not.
    - node_js: '20'
      install:
        - nvm install 0.10
        - nvm use 0.10
        - node --version
        - npm --version
        - npm install
        - ./node_modules/.bin/grunt
        - nvm use 20
        - node --version
        # The driver lives in its own tree so npm 10 never reifies jQuery's
        # node 0.10 node_modules.
        - mkdir -p /tmp/driver
        - cd /tmp/driver
        - npm init -y
        - npm install puppeteer-core@22
        - cd "$TRAVIS_BUILD_DIR"
        - google-chrome --version
        - php --version
      script:
        # Multiple workers are load-bearing: single-process php -S serializes
        # requests and starves the fixture iframes the suite opens.
        - PHP_CLI_SERVER_WORKERS=10 php -S 127.0.0.1:8000 -t . > /tmp/php.log 2>&1 &
        - for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/test/index.html > /dev/null && break; sleep 1; done
        - curl -sf http://127.0.0.1:8000/test/index.html > /dev/null
        # Exclusions are environment-dependent in modern headless Chrome, not
        # jQuery bugs: Chrome forbids sync XHR during page unload (#14379), and
        # Blink snaps offsets to 1/64 px (fractions reads back 999.984375).
        # `?dev` makes test/jquery.js load dist/jquery.js, not jquery.min.js.
        - >-
          echo "SEAL test exclusion (environment-dependent, unsupported in modern headless Chrome) -
          'ajax: #14379 - jQuery.ajax() on unload': Chrome forbids synchronous XHR during page unload,
          which this test performs"
        - >-
          echo "SEAL test exclusion (environment-dependent, browser layout precision) -
          'offset: fractions (see #7730 and #7885)': Blink snaps layout offsets to 1/64 px,
          so the expected 1000 reads back as 999.984375"
        - >-
          SEAL_SKIP_TESTS="ajax: #14379 - jQuery.ajax() on unload||offset: fractions (see #7730 and #7885)"
          NODE_PATH=/tmp/driver/node_modules
          CHROME_PATH="$(command -v google-chrome)"
          node test/seal-browser-runner.js "http://127.0.0.1:8000/test/index.html?dev"
